{% extends "base.html" %}

{% block title %}Single Experiment - BIPV Heat Dashboard{% endblock %}

{% block content %}
<!-- Top section - 30% height, 3 columns -->
<div class="row mb-3 top-section">
    <!-- Column 1: Filter Controls -->
    <div class="col-4">
        <div class="card h-100">
            <div class="card-body">
                <h4>Experiment Filter</h4>
                
                <!-- Filter Controls -->
                <div class="mb-3">
                    <div class="radio-group" id="G-radio-group">
                        <label class="form-label radio-group-label">G - Irradiance (W/m²):</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="G-filter" id="G-all" value="all" checked>
                            <label class="form-check-label" for="G-all">All</label>
                        </div>
                        <!-- Dynamic radio buttons will be added here -->
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="radio-group" id="T-radio-group">
                        <label class="form-label radio-group-label">T - Temperature (°C):</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="T-filter" id="T-all" value="all" checked>
                            <label class="form-check-label" for="T-all">All</label>
                        </div>
                        <!-- Dynamic radio buttons will be added here -->
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="radio-group" id="A-radio-group">
                        <label class="form-label radio-group-label">A - Azimuth (°):</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="A-filter" id="A-all" value="all" checked>
                            <label class="form-check-label" for="A-all">All</label>
                        </div>
                        <!-- Dynamic radio buttons will be added here -->
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="radio-group" id="Ti-radio-group">
                        <label class="form-label radio-group-label">Ti - Tilt (°):</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Ti-filter" id="Ti-all" value="all" checked>
                            <label class="form-check-label" for="Ti-all">All</label>
                        </div>
                        <!-- Dynamic radio buttons will be added here -->
                    </div>
                </div>

                <div class="mb-3">
                    <div class="radio-group" id="Type-radio-group">
                        <label class="form-label radio-group-label">Type:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="Type-filter" id="Type-all" value="all" checked>
                            <label class="form-check-label" for="Type-all">All</label>
                        </div>
                        <!-- Dynamic radio buttons will be added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Column 2: Available Options -->
    <div class="col-4">
        <div class="card h-100">
            <div class="card-body">
                <h4>Available Options</h4>
                
                <!-- Filtered Results -->
                <label for="filtered-experiments" class="form-label">Matching Experiments:</label>
                <select id="filtered-experiments" class="form-select mb-3" size="6"></select>
                <button id="download-button" class="btn btn-primary w-100" disabled>Download Raw Data</button>
            </div>
        </div>
    </div>
    
    <!-- Column 3: Experiment Information -->
    <div class="col-4">
        <div class="card h-100">
            <div class="card-body">
                <h4>Experiment Information</h4>
                <div id="file-status" class="mb-2"></div>
                <div id="experiment-details"></div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom section - 80% height -->
<div class="row bottom-section">
    <!-- Left side - Plot area (70%) -->
    <div class="col-9">
        <div class="card h-100">
            <div class="card-body">
                <div id="unit-warning" class="text-danger fw-bold mb-2"></div>
                <div id="timeseries-plot" class="plot-container"></div>
            </div>
        </div>
    </div>
    
    <!-- Right side - Controls and Legend (30%) -->
    <div class="col-3">
        <div class="card h-100">
            <div class="card-body">
                <h4>Series Selection</h4>
                <label for="series-dropdown" class="form-label">Select series (multiple allowed):</label>
                <select id="series-dropdown" class="form-select" multiple></select>
                <hr>
                <h4>Legend</h4>
                <div id="custom-legend"></div>
                <hr>
                <button id="download-plot-data" class="btn btn-sm btn-outline-primary w-100" disabled>
                    <i class="fas fa-download me-1"></i>Download Plot Data
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentExperiment = null;
let currentSeries = [];

// Page-specific callback for handling filtered experiments update
function handleFilteredExperimentsUpdate(filteredExperiments) {
    // Auto-select first experiment if none selected
    if (!currentExperiment || !filteredExperiments.find(e => e.code === currentExperiment)) {
        const dropdown = $('#filtered-experiments');
        dropdown.val(filteredExperiments[0].code);
        selectExperiment(filteredExperiments[0].code);
    }
}

// Load experiments and setup filters on page load
$(document).ready(function() {
    loadExperimentCharacteristics();
});

// Handle experiment selection from filtered list
$('#filtered-experiments').change(function() {
    const experimentCode = $(this).val();
    selectExperiment(experimentCode);
});

function selectExperiment(experimentCode) {
    if (!experimentCode) return;
    
    currentExperiment = experimentCode;
    
    $.get(`/api/experiment/${experimentCode}`, function(data) {
        if (data.error) {
            $('#file-status').html(`<div class="alert alert-danger">${data.error}</div>`);
            return;
        }
        
        // Update status
        // $('#file-status').html(`<div class="alert alert-success">${data.status}</div>`);
        
        // Update experiment details
        const details = data.experiment_details;
        let detailsHtml = '';
        
        if (details.status) {
            detailsHtml = `<div class="alert alert-warning">${details.status}</div>`;
        } else {
            detailsHtml = `
                <p><strong>Date:</strong> ${details.date}</p>
                <p><strong>Monitor:</strong> ${details.monitor}</p>
                <p><strong>IR:</strong> ${details.ir}</p>
                <p><strong>Warm White:</strong> ${details.ww}</p>
                <p><strong>Cold White:</strong> ${details.cw}</p>
                <p><strong>Notes:</strong> <em>${details.notes}</em></p>
            `;
        }
        $('#experiment-details').html(detailsHtml);
        
        // Update series dropdown
        const seriesDropdown = $('#series-dropdown');
        seriesDropdown.empty();
        
        data.series_options.forEach(function(series) {
            seriesDropdown.append($('<option>', {
                value: series.value,
                text: series.label
            }));
        });
        
        // Smart series selection logic
        selectBestSeriesForSingle(data.series_options);
        updatePlot();
    });
}

// Updated to use shared function and update currentSeries
function selectBestSeriesForSingle(availableSeries) {
    currentSeries = selectBestSeries(availableSeries, SERIES_STORAGE_KEY_SINGLE);
    console.log('Selected series for experiment', currentExperiment, ':', currentSeries);
}

// Handle series selection
$('#series-dropdown').change(function() {
    currentSeries = $(this).val() || [];
    
    // Save the selection to localStorage
    saveSelectedSeries(currentSeries, SERIES_STORAGE_KEY_SINGLE);
    
    updatePlot();
});

// Handle download button (raw data)
$('#download-button').click(function() {
    if (!currentExperiment) return;
    window.location.href = `/download/${currentExperiment}`;
});

// Handle download plot data button
$('#download-plot-data').click(function() {
    if (!currentExperiment || !currentSeries.length) return;
    
    const queryParams = new URLSearchParams();
    queryParams.append('experiment', currentExperiment);
    currentSeries.forEach(series => queryParams.append('series[]', series));
    queryParams.append('format', 'csv');
    
    window.location.href = `/api/plot-data?${queryParams.toString()}`;
});

function updatePlot() {
    if (!currentExperiment || !currentSeries.length) return;
    
    const queryParams = new URLSearchParams();
    queryParams.append('experiment', currentExperiment);
    currentSeries.forEach(series => queryParams.append('series[]', series));
    
    $.get(`/api/plot?${queryParams.toString()}`, function(data) {
        if (data.error) {
            $('#unit-warning').text(data.error);
            return;
        }
        
        $('#unit-warning').text(data.warning || '');
        Plotly.newPlot('timeseries-plot', data.plot.data, data.plot.layout);
        
        // Update custom legend
        updateCustomLegend(data.legend || []);
        
        // Enable download button
        $('#download-plot-data').prop('disabled', false);
    });
}

// Legend functions are now in common.js
</script>
{% endblock %}
